# Statické servírování web-leptos/dist (nginx-unprivileged, read-only rootfs).
# CSP generuje Trunk hook (scripts/web-leptos-csp.sh) do dist/nginx-csp.conf – hash inline zavaděče
# se mění s každým buildem, proto se hlavička NEpíše ručně. Soubor se kopíruje do /etc/nginx/elfall-csp.conf.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    include /etc/nginx/elfall-csp.conf;   # add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'wasm-unsafe-eval' 'sha384-…'; … frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    types { application/wasm wasm; }
    location = /sw.js { add_header Cache-Control "no-cache" always; include /etc/nginx/elfall-csp.conf; try_files $uri =404; }
    location = /index.html { add_header Cache-Control "no-cache" always; include /etc/nginx/elfall-csp.conf; }
    # Passkeys: stejný origin (connect-src 'self') → backend webauthn4j
    location /passkey/ { proxy_pass http://bankid:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; }
    location / { try_files $uri /index.html; }
    location ~ /\. { deny all; }
}
