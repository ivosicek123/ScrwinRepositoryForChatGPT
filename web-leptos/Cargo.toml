[package]
name = "elfall-web"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
description = "Eleanor PWA – Leptos (CSR) nad elfall-core; jen čtení, žádné klíče v prohlížeči"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
elfall-core = { path = "../core" }
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
js-sys = "0.3"
# core -> getrandom 0.2 na wasm32 potřebuje backend crypto.getRandomValues
getrandom = { version = "0.2", features = ["js"] }
qrcodegen = "1.8"
base64 = "0.23.1"
web-sys = { version = "0.3", features = ["Window", "Storage", "Request", "RequestInit", "RequestMode", "RequestCredentials", "Response", "Navigator", "ServiceWorkerContainer", "Headers", "Location", "CredentialsContainer", "CredentialCreationOptions", "CredentialRequestOptions"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
