# Trunk (CSR, statické soubory, žádný SSR server). Sestavení: scripts/build-web-leptos.sh (trunk build --release).
[build]
target = "index.html"
dist = "dist"
filehash = false          # stabilní názvy pro service worker; integritu řeší SRI + CSP hash
public_url = "/"

# CSP se počítá z hotového index.html (SHA-384 inline zavaděče od Trunku) a zapisuje se do:
#   dist/index.html (<meta>), dist/_headers, dist/nginx-csp.conf (pro deploy/web-leptos/nginx.conf).
[[hooks]]
stage = "post_build"
command = "bash"
command_arguments = ["../scripts/web-leptos-csp.sh"]

# Vývojový server (trunk serve): stejná politika bez hashe není možná (autoreload je inline),
# proto dev používá jen hlavičky, které nerozbijí reload; produkce = dist + nginx.
[serve]
addresses = ["127.0.0.1"]
[serve.headers]
"X-Content-Type-Options" = "nosniff"
"Referrer-Policy" = "no-referrer"
"X-Frame-Options" = "DENY"
