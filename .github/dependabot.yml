version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
  - package-ecosystem: gradle
    directory: "/"
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: "/runpod"
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
